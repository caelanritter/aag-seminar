<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Seminar</title>
<meta name="description" content="Talk schedule for the Vanderbilt AAG seminar.">

<!-- ============================================================
     HOW TO SET THIS UP (read me first!)
     ============================================================
     1. Make a Google Sheet with these exact column headers in row 1:
          Date | Time | Speaker | Affiliation | Title | Abstract | Location | Speaker Website

        - Date: any format Sheets understands, e.g. 2026-09-15
        - Time: e.g. 4:00 PM  (optional)
        - Abstract: LaTeX works — write $x^2$ or \[ \int_0^1 f \] normally
        - Location: e.g. "Room 214" or "Zoom" (optional)
        - Speaker Website: full https:// URL to the speaker's homepage (optional);
          the speaker's name becomes a link to it

     2. File → Share → Publish to web → select that sheet → CSV → Publish.
        Copy the URL it gives you.

     3. Paste that URL into CONFIG.sheetCsvUrl below

     4. Edit CONFIG.seminarName / tagline / meetingInfo / contactEmail below too.

     From then on, updating the sheet updates the site automatically —
     no need to touch this file again.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<style>
  :root{
    --bg: #FBFAF5;
    --bg-card: #FFFFFF;
    --ink: #1A1A1A;
    --ink-dim: #625F57;
    --ink-faint: #9B968B;
    --rule: rgba(26,26,26,0.14);
    --rule-strong: rgba(26,26,26,0.32);
    --accent: #1E3A5F;
    --accent-hover: #12253E;
    --accent-tint: rgba(30,58,95,0.06);
    --accent-border: rgba(30,58,95,0.28);
    --link-underline: rgba(30,58,95,0.35);
    --code-bg: rgba(26,26,26,0.06);
    --font-display: "STIX Two Text", "Times New Roman", serif;
    --font-body: "STIX Two Text", "Times New Roman", serif;
    --font-mono: "IBM Plex Mono", monospace;

    /* Abstract paragraph layout — adjust these two to taste.
       Set either one to 0 to turn it off. */
    --abstract-para-gap: 0.5em;   /* extra space between paragraphs */
    --abstract-indent: 1.5em;     /* first-line indent, paragraphs 2+ */
  }

  /* --- Dark mode ---
     Applies automatically by system preference, and can be overridden
     per-session by the toggle button. */
  :root[data-theme="dark"]{
    --bg: #15181B;
    --bg-card: #1F242A;
    --ink: #ECEAE4;
    --ink-dim: #A7A39A;
    --ink-faint: #88837A;
    --rule: rgba(236,234,228,0.14);
    --rule-strong: rgba(236,234,228,0.30);
    --accent: #86ABDD;
    --accent-hover: #C3D7F4;
    --accent-tint: rgba(134,171,221,0.10);
    --accent-border: rgba(134,171,221,0.35);
    --link-underline: rgba(134,171,221,0.40);
    --code-bg: rgba(236,234,228,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #15181B;
      --bg-card: #1F242A;
      --ink: #ECEAE4;
      --ink-dim: #A7A39A;
      --ink-faint: #88837A;
      --rule: rgba(236,234,228,0.14);
      --rule-strong: rgba(236,234,228,0.30);
      --accent: #86ABDD;
      --accent-hover: #C3D7F4;
      --accent-tint: rgba(134,171,221,0.10);
      --accent-border: rgba(134,171,221,0.35);
      --link-underline: rgba(134,171,221,0.40);
      --code-bg: rgba(236,234,228,0.08);
    }
  }

  *, *::before, *::after{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: no-preference){
    body, .next-talk-card, .date-badge, .state-box, .theme-toggle{
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
  }

  a{
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--link-underline);
    text-underline-offset: 2px;
  }
  a:hover{ color: var(--accent-hover); text-decoration-color: currentColor; }

  *:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 52px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    margin-bottom: 44px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--rule-strong);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .header-text{ min-width: 0; flex: 1 1 auto; }

  .theme-toggle{
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    line-height: 1;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle:hover{ color: var(--accent); border-color: var(--accent-border); }

  h1.seminar-name{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.65rem, 6.4vw, 2.5rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0;
    overflow-wrap: break-word;
  }

  .tagline{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-dim);
    margin: 10px 0 12px;
  }

  .meeting-info{
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
  }

  /* ---------- Section labels ---------- */
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h2.section-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---------- Next talk hero ---------- */
  .next-talk{ margin-bottom: 52px; }

  .next-talk-card{
    background: var(--accent-tint);
    border: 1px solid var(--accent-border);
    border-radius: 3px;
    padding: 26px;
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }

  .date-badge{
    flex: 0 0 auto;
    width: 64px;
    text-align: center;
    background: var(--bg-card);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 10px 4px;
  }
  .date-badge .day{
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.6rem;
    color: var(--accent);
    line-height: 1;
  }
  .date-badge .month{
    display: block;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .talk-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0 0 6px;
    line-height: 1.35;
  }
  .talk-speaker{
    margin: 0 0 4px;
    font-style: italic;
    color: var(--ink);
  }
  .talk-speaker .affil{ color: var(--ink-dim); font-style: normal; }
  .talk-meta{
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }
  .talk-abstract{
    color: var(--ink-dim);
    font-size: 0.97rem;
    white-space: pre-line;
    margin: 0 0 12px;
  }
  .talk-abstract p{ margin: 0; }
  .talk-abstract p + p{
    margin-top: var(--abstract-para-gap);
    text-indent: var(--abstract-indent);
  }
  /* keep centered display math from being nudged by the indent */
  .talk-abstract .katex-display{ text-indent: 0; }

  /* ---------- Timeline ---------- */
  .timeline-list{
    list-style: none;
    margin: 0;
    padding: 0 0 0 4px;
    border-left: 1px solid var(--rule);
  }
  .timeline-item{
    position: relative;
    padding: 0 0 30px 26px;
  }
  .timeline-item:last-child{ padding-bottom: 4px; }
  .timeline-dot{
    position: absolute;
    left: -4.5px;
    top: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--bg);
  }
  .timeline-list.muted .timeline-dot{ background: var(--ink-faint); }
  .timeline-list.muted .talk-title,
  .timeline-list.muted .talk-speaker{ color: var(--ink-dim); }
  .timeline-list.muted .talk-abstract{ color: var(--ink-faint); }

  .timeline-item.reveal{
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .timeline-item.reveal.in-view{ opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce){
    .timeline-item.reveal{ opacity: 1; transform: none; transition: none; }
  }

  section.timeline{ margin-bottom: 36px; }

  /* ---------- Past talks ---------- */
  details.past-talks{ margin-top: 4px; }
  details.past-talks summary{
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--ink-dim);
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    list-style: none;
  }
  details.past-talks summary::-webkit-details-marker{ display: none; }
  details.past-talks summary::before{
    content: "▸ ";
    color: var(--ink-faint);
  }
  details.past-talks[open] summary::before{ content: "▾ "; }
  details.past-talks[open] summary{ margin-bottom: 16px; }

  .semester-group{ margin-bottom: 30px; }
  .semester-group:last-child{ margin-bottom: 4px; }
  .semester-label{
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 14px;
  }
  .semester-label::before{
    content: "§ ";
    color: var(--ink-faint);
  }

  /* ---------- States: loading / empty / error ---------- */
  .state-box{
    background: var(--bg-card);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 30px 26px;
    text-align: left;
  }
  .state-box h3{
    font-family: var(--font-display);
    font-weight: 600;
    margin: 0 0 8px;
    font-size: 1.1rem;
  }
  .state-box p{ color: var(--ink-dim); margin: 0 0 6px; }
  .state-box code{
    font-family: var(--font-mono);
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.85em;
  }
  .loading-text{
    font-family: var(--font-mono);
    color: var(--ink-faint);
    font-size: 0.88rem;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top: 60px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
  footer a{ color: var(--ink-dim); }

  @media (max-width: 560px){
    .next-talk-card{ flex-direction: column; }
    .date-badge{ flex-direction: row; width: auto; display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; }
  }

</style>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">☾</button>

  <main id="app">

<!-- ===================== CONFIG — edit this ===================== -->
<script>
  const CONFIG = {
    seminarName: "Vanderbilt Algebra and Algebraic Geometry Seminar",
    tagline: "",
    meetingInfo: "Tuesdays · 11 am · Stevenson Center TBD",
    contactEmail: "caelan.ritter@vanderbilt.edu",

    // How many minutes after a talk's start time it should still be shown
    // as "Ongoing" at the top of the page (instead of moving to Past
    // talks). Only applies to talks with a Time; a talk with just a Date
    // stays at the top labeled "Next up" for its entire calendar day
    // instead, since there's no specific start time to measure from.
    // Set to 0 to disable and move timed talks to Past immediately.
    ongoingMinutes: 60,

    // Paste your Google Sheet's "Publish to web → CSV" link here:
    sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR3T1u2a2WGMMM7u7Cl88oWipqd2cnuk20dDrL45V-uU15ULvc9QxpKN3st4QDDUfCmxonxxG_0XxQh/pub?gid=0&single=true&output=csv"
  };
</script>
<!-- ================================================================ -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
(function(){
  const app = document.getElementById('app');

  // ---- dark mode toggle ----
  // The default (system-preference) theme is handled entirely by CSS via
  // prefers-color-scheme, so this only needs to manage the manual override.
  // The override is in-memory for this page load only — see chat reply for
  // why, and how to add persistence once this is hosted on its own domain.
  (function setupThemeToggle(){
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;

    function effectiveTheme(){
      const explicit = root.getAttribute('data-theme');
      if (explicit === 'light' || explicit === 'dark') return explicit;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function syncButton(){
      const theme = effectiveTheme();
      btn.textContent = theme === 'dark' ? '☀' : '☾';
      btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }

    btn.addEventListener('click', () => {
      root.setAttribute('data-theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
      syncButton();
    });

    syncButton();
  })();


  // ---- fill header from CONFIG ----
  document.title = CONFIG.seminarName;
  document.getElementById('seminar-name').textContent = CONFIG.seminarName;
  document.getElementById('tagline').textContent = CONFIG.tagline || '';
  document.getElementById('meeting-info').textContent = CONFIG.meetingInfo || '';
  const footer = document.getElementById('footer-contact');
  if (CONFIG.contactEmail){
    footer.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = 'Questions? Write to ';
    const link = document.createElement('a');
    link.href = 'mailto:' + CONFIG.contactEmail;
    link.textContent = CONFIG.contactEmail;
    footer.appendChild(span);
    footer.appendChild(link);
  }

  // ---- helpers ----
  function el(tag, className, text){
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function getField(row, name){
    const keys = Object.keys(row);
    const match = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
    return match ? String(row[match] || '').trim() : '';
  }

  function isSafeUrl(url){
    return /^https?:\/\//i.test(url);
  }

  // Fall = Aug 19–Dec 31, Spring = Jan 1–Apr 30, Summer = May 1–Aug 18.
  // sortKey is monotonic across years so groups sort correctly regardless
  // of how many years of talks the sheet contains.
  function computeSemester(date){
    if (!date) return { label: 'Date TBD', sortKey: Infinity };
    const year = date.getFullYear();
    const month = date.getMonth(); // 0 = Jan ... 11 = Dec
    const day = date.getDate();
    let name;
    if (month <= 3){
      name = 'Spring';
    } else if (month <= 6 || (month === 7 && day <= 18)){
      name = 'Summer';
    } else {
      name = 'Fall';
    }
    const order = { Spring: 0, Summer: 1, Fall: 2 }[name];
    return { label: name + ' ' + year, sortKey: year * 10 + order };
  }

  // Parses a talk's Date/Time columns into a single Date, and reports
  // whether a real time was available. Bare "YYYY-MM-DD" strings are
  // parsed in LOCAL time here rather than left to the JS default (which
  // treats them as UTC midnight and can silently shift the calendar day
  // by one, depending on the visitor's timezone).
  function parseTalkDate(dateStr, timeStr){
    const trimmedTime = (timeStr || '').trim();
    if (trimmedTime){
      const withTime = new Date(dateStr + ' ' + trimmedTime);
      if (!isNaN(withTime.getTime())) return { date: withTime, hasTime: true };
    }
    const isoMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec((dateStr || '').trim());
    if (isoMatch){
      const [, y, m, d] = isoMatch;
      const local = new Date(Number(y), Number(m) - 1, Number(d));
      if (!isNaN(local.getTime())) return { date: local, hasTime: false };
    }
    const fallback = new Date(dateStr);
    return { date: isNaN(fallback.getTime()) ? null : fallback, hasTime: false };
  }

  function rowToTalk(row){
    const dateStr = getField(row, 'Date');
    const title = getField(row, 'Title');
    if (!dateStr || !title) return null;

    const timeStr = getField(row, 'Time');
    const { date, hasTime } = parseTalkDate(dateStr, timeStr);

    return {
      date, dateStr, timeStr, hasTime,
      speaker: getField(row, 'Speaker'),
      affiliation: getField(row, 'Affiliation'),
      title,
      abstract: getField(row, 'Abstract'),
      location: getField(row, 'Location'),
      link: getField(row, 'Speaker Website') || getField(row, 'Link'),
      semester: computeSemester(date)
    };
  }

  function talkMetaLine(talk, omitDate){
    const bits = [];
    if (omitDate) {
      // date is already shown elsewhere (e.g. the hero's date badge)
    } else if (talk.date) {
      bits.push(talk.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }));
    } else if (talk.dateStr) {
      bits.push(talk.dateStr);
    }
    if (talk.timeStr) bits.push(talk.timeStr);
    if (talk.location) bits.push(talk.location);
    return bits.join(' · ');
  }

  function buildTalkBody(talk, omitDate){
    const frag = document.createDocumentFragment();
    frag.appendChild(el('h3', 'talk-title', talk.title));

    if (talk.speaker || talk.affiliation){
      const p = el('p', 'talk-speaker');
      if (talk.speaker && talk.link && isSafeUrl(talk.link)){
        const a = document.createElement('a');
        a.className = 'speaker-link';
        a.href = talk.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = talk.speaker;
        p.appendChild(a);
      } else {
        p.appendChild(document.createTextNode(talk.speaker));
      }
      if (talk.affiliation){
        const s = el('span', 'affil', '  —  ' + talk.affiliation);
        p.appendChild(s);
      }
      frag.appendChild(p);
    }

    const meta = talkMetaLine(talk, omitDate);
    if (meta) frag.appendChild(el('p', 'talk-meta', meta));

    if (talk.abstract){
      // A blank line in the sheet starts a new paragraph (as in LaTeX).
      const abs = el('div', 'talk-abstract');
      talk.abstract
        .replace(/\r\n?/g, '\n')
        .split(/\n[ \t]*\n+/)
        .map(para => para.trim())
        .filter(Boolean)
        .forEach(para => abs.appendChild(el('p', null, para)));
      frag.appendChild(abs);
    }

    return frag;
  }

  function buildHero(talk, isOngoing){
    const section = el('section', 'next-talk');
    section.appendChild(el('p', 'eyebrow', isOngoing ? 'Ongoing' : 'Next up'));
    const card = el('div', 'next-talk-card');

    if (talk.date){
      const badge = el('div', 'date-badge');
      badge.appendChild(el('span', 'day', String(talk.date.getDate())));
      badge.appendChild(el('span', 'month', talk.date.toLocaleDateString(undefined, { month: 'short' })));
      card.appendChild(badge);
    }
    const body = el('div', 'next-talk-body');
    body.appendChild(buildTalkBody(talk, !!talk.date));
    card.appendChild(body);
    section.appendChild(card);
    return section;
  }

  function appendTalkItems(listEl, talks){
    talks.forEach(talk => {
      const item = el('li', 'timeline-item reveal');
      item.appendChild(el('div', 'timeline-dot'));
      const content = el('div', 'timeline-content');
      content.appendChild(buildTalkBody(talk));
      item.appendChild(content);
      listEl.appendChild(item);
    });
  }

  // Groups talks by their computed semester. order: 'asc' puts the
  // soonest semester first (for upcoming talks), 'desc' puts the most
  // recent semester first (for past talks). Talks within each group sort
  // the same direction.
  function groupBySemester(talks, order){
    const groups = new Map();
    talks.forEach(talk => {
      const sem = talk.semester;
      if (!groups.has(sem.sortKey)) groups.set(sem.sortKey, { label: sem.label, sortKey: sem.sortKey, talks: [] });
      groups.get(sem.sortKey).talks.push(talk);
    });
    const groupArr = Array.from(groups.values());
    groupArr.forEach(g => {
      g.talks.sort((a, b) => order === 'desc' ? b.date - a.date : a.date - b.date);
    });
    groupArr.sort((a, b) => order === 'desc' ? b.sortKey - a.sortKey : a.sortKey - b.sortKey);
    return groupArr;
  }

  function buildSemesterGroups(talks, order, muted, showLabels){
    const frag = document.createDocumentFragment();
    groupBySemester(talks, order).forEach(group => {
      const groupEl = el('div', 'semester-group');
      if (showLabels){
        groupEl.appendChild(el('p', 'semester-label', group.label));
      }
      const list = el('ol', 'timeline-list' + (muted ? ' muted' : ''));
      appendTalkItems(list, group.talks);
      groupEl.appendChild(list);
      frag.appendChild(groupEl);
    });
    return frag;
  }

  function buildTimeline(title, talks, order){
    const section = el('section', 'timeline');
    section.appendChild(el('h2', 'section-title', title));
    // Only show the "§ Fall 2026" style sub-headings here if the talks
    // actually span more than one semester — with just one, the section
    // title above already says enough, and a lone repeated heading is
    // just clutter.
    const semesterCount = new Set(talks.map(t => t.semester.sortKey)).size;
    section.appendChild(buildSemesterGroups(talks, order, false, semesterCount > 1));
    return section;
  }

  function buildPastSection(pastTalks){
    const details = document.createElement('details');
    details.className = 'past-talks';
    const summary = document.createElement('summary');
    summary.textContent = 'Past talks (' + pastTalks.length + ')';
    details.appendChild(summary);
    details.appendChild(buildSemesterGroups(pastTalks, 'desc', true, true));
    return details;
  }

  function stateBox(heading, lines){
    const box = el('div', 'state-box');
    box.appendChild(el('h3', null, heading));
    lines.forEach(line => box.appendChild(line));
    return box;
  }

  function showLoading(){
    app.innerHTML = '';
    app.appendChild(el('p', 'loading-text', 'Loading the schedule…'));
  }

  function showNoUrlConfigured(){
    app.innerHTML = '';
    const p1 = el('p', null, null);
    p1.appendChild(document.createTextNode('Nothing is connected yet.'));
    const p2 = el('p', null, null);
    p2.appendChild(document.createTextNode('Open this file, find '));
    p2.appendChild(el('code', null, 'CONFIG.sheetCsvUrl'));
    p2.appendChild(document.createTextNode(' near the top, and paste in your sheet\u2019s published CSV link.'));
    app.appendChild(stateBox('Connect your talk list', [p1, p2]));
  }

  function showError(err){
    app.innerHTML = '';
    const p1 = el('p', null, 'Couldn\u2019t load the schedule: ' + err.message);
    const p2 = el('p', null, null);
    p2.appendChild(document.createTextNode('Double check the sheet is published (File \u2192 Share \u2192 Publish to web) and that row 1 has the headers: '));
    p2.appendChild(el('code', null, 'Date, Time, Speaker, Affiliation, Title, Abstract, Location, Speaker Website'));
    app.appendChild(stateBox('Something went wrong', [p1, p2]));
  }

  function showEmptyTalks(){
    app.innerHTML = '';
    app.appendChild(stateBox('No talks scheduled yet', [el('p', null, 'Check back soon, or add a row to the sheet.')]));
  }

  function renderMath(){
    if (window.renderMathInElement){
      try {
        renderMathInElement(app, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false
        });
      } catch (e) { /* fail quietly, plain text still shows */ }
    }
  }

  function setupRevealAnimation(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const items = document.querySelectorAll('.timeline-item.reveal');
    if (!('IntersectionObserver' in window)){
      items.forEach(i => i.classList.add('in-view'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    items.forEach(i => io.observe(i));
  }

  function render(talks){
    app.innerHTML = '';
    const now = new Date();
    const ongoingMs = Math.max(0, Number(CONFIG.ongoingMinutes) || 0) * 60000;
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const withDate = talks.filter(t => t.date);
    const withoutDate = talks.filter(t => !t.date);
    withDate.sort((a, b) => a.date - b.date);

    function talkDay(t){
      return new Date(t.date.getFullYear(), t.date.getMonth(), t.date.getDate());
    }

    // Talks with a real Time are judged against the exact instant, with an
    // "ongoing" window of ongoingMs after the start. Talks with only a
    // Date can't be judged against a clock time, so they simply count as
    // "today" until the calendar day is over, and never claim "Ongoing"
    // (there's no start time to anchor that label to).
    const isOngoing = t => t.hasTime && now >= t.date && now.getTime() < t.date.getTime() + ongoingMs;
    const isPast = t => t.hasTime
      ? now.getTime() >= t.date.getTime() + ongoingMs
      : talkDay(t) < today;

    // If (unusually) more than one talk is "ongoing" at once, the most
    // recently-started one wins the hero spot; withDate is sorted
    // ascending, so that's the last match.
    const ongoingTalks = withDate.filter(isOngoing);
    const heroTalk = ongoingTalks.length > 0
      ? ongoingTalks[ongoingTalks.length - 1]
      : (withDate.find(t => !isPast(t)) || withoutDate[0]);
    const heroIsOngoing = !!heroTalk && ongoingTalks.includes(heroTalk);

    const upcoming = withDate
      .filter(t => t !== heroTalk && !isPast(t))
      .concat(withoutDate.filter(t => t !== heroTalk));
    const past = withDate.filter(isPast).slice().reverse();

    if (!heroTalk && past.length === 0){
      showEmptyTalks();
      return;
    }

    if (heroTalk){
      app.appendChild(buildHero(heroTalk, heroIsOngoing));
    } else {
      app.appendChild(stateBox('No upcoming talks', [el('p', null, 'Check back soon \u2014 the next talk will appear here.')]));
    }
    if (upcoming.length > 0){
      app.appendChild(buildTimeline('Upcoming talks', upcoming, 'asc'));
    }

    if (past.length > 0){
      app.appendChild(buildPastSection(past));
    }

    renderMath();
    setupRevealAnimation();
  }

  async function loadTalks(){
    if (!CONFIG.sheetCsvUrl){
      showNoUrlConfigured();
      return;
    }
    showLoading();
    try {
      const res = await fetch(CONFIG.sheetCsvUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const talks = parsed.data.map(rowToTalk).filter(Boolean);
      render(talks);
    } catch (err){
      showError(err);
    }
  }

  loadTalks();
})();
</script>

</body>
</html>
